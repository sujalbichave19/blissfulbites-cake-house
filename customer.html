<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4A2418"><title>My Account | BlissfulBites</title><link rel="stylesheet" href="style.css"><style>
.account-wrap{max-width:980px;margin:55px auto;padding:20px}.account-card{background:#fff;border:1px solid #eadcc8;border-radius:18px;padding:26px;margin:18px 0;box-shadow:0 12px 35px #4a24180d}.account-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.account-card input{display:block;width:100%;padding:13px;margin:8px 0 15px;border:1px solid #d9c8b5;border-radius:9px;font:inherit}.account-card button{margin:5px 7px 5px 0}.account-muted{color:#76665d}.account-hidden{display:none!important}.order-card{border:1px solid #eadcc8;border-radius:12px;padding:16px;margin:12px 0}.order-status{display:inline-block;background:#fff0d5;color:#744d13;padding:5px 10px;border-radius:20px;font-size:13px;text-transform:capitalize}.account-message{min-height:24px;color:#744d13}.account-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style></head><body><div class="announcement">Handcrafted with love in Dharangaon ✦ Happiness in Every Bite</div><main class="account-wrap"><a href="index.html" class="footer-brand">← The BlissfulBites <span>CAKE HOUSE</span></a><h1 style="font-family:'Playfair Display',serif;color:#4A2418">Your BlissfulBites Account</h1><p class="account-muted">Sign in to place orders and keep track of your cake history.</p>
<section id="auth-panel" class="account-grid"><form id="signup-form" class="account-card"><h2>Create account</h2><label>Full name<input name="name" required minlength="2" maxlength="70" autocomplete="name"></label><label>Phone number<input name="phone" required minlength="8" maxlength="18" autocomplete="tel"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="6" autocomplete="new-password"></label><button class="button button-primary" type="submit">Sign up</button></form><form id="login-form" class="account-card"><h2>Customer login</h2><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button button-primary" type="submit">Log in</button><button type="button" id="forgot-password" class="button button-light">Forgot password?</button></form></section>
<section id="dashboard" class="account-card account-hidden"><div class="account-top"><div><h2>My account</h2><p id="customer-email" class="account-muted"></p></div><button id="logout" class="button button-light">Log out</button></div><form id="profile-form" class="account-grid"><label>Full name<input name="name" required minlength="2" maxlength="70"></label><label>Phone number<input name="phone" required minlength="8" maxlength="18"></label><div><button class="button button-primary" type="submit">Save profile</button></div></form><p id="account-message" class="account-message" role="status"></p><h2>My previous orders</h2><div id="orders-list"><p class="account-muted">Loading orders…</p></div></section></main><script type="module" src="customer.js"></script></body></html>
