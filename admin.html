<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlissfulBites | Review Admin</title>
<style>
:root{--brown:#4b2e24;--gold:#c49a52;--cream:#fffaf2}*{box-sizing:border-box}body{margin:0;background:var(--cream);font:16px Arial,sans-serif;color:#302019}.wrap{max-width:900px;margin:40px auto;padding:20px}.panel,.review{background:white;border:1px solid #eadcc8;border-radius:14px;padding:20px;margin:14px 0}h1,h2{color:var(--brown)}input{padding:12px;border:1px solid #cdbca8;border-radius:8px;width:100%;margin:7px 0 14px}button{padding:10px 14px;border:0;border-radius:8px;background:var(--brown);color:white;cursor:pointer;margin:5px}button.reject{background:#8a3e32}button:disabled{opacity:.5}.muted{color:#76665d}.hidden{display:none}.review p{line-height:1.5;overflow-wrap:anywhere}.stars{color:var(--gold)}#message{min-height:22px;color:#76665d}
</style></head><body><main class="wrap"><h1>BlissfulBites · Review Admin</h1><p class="muted">Sign in with the admin Firebase account to moderate customer reviews.</p>
<section id="login-panel" class="panel"><h2>Admin login</h2><form id="login-form"><label>Email</label><input name="email" type="email" required autocomplete="username"><label>Password</label><input name="password" type="password" required autocomplete="current-password"><button type="submit">Log in</button></form></section>
<section id="dashboard" class="hidden"><div class="panel"><strong id="admin-email"></strong><button id="logout" style="float:right">Log out</button><h2>Pending reviews</h2><p class="muted">Approve genuine reviews to publish them on the website, or reject unsuitable submissions.</p></div><div id="reviews"></div></section><p id="message" role="status"></p></main>
<script type="module" src="./admin.js"></script></body></html>
